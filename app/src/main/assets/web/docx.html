<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<link rel="stylesheet" href="base.css">
<style>
  .docx-wrapper { background: transparent !important; padding: 8px !important; }
  .docx-wrapper > section.docx { margin: 0 auto 10px !important; box-shadow: 0 1px 3px rgba(0,0,0,.3) !important; }
</style>
<script src="jszip.min.js"></script>
<script src="docx-preview.min.js"></script>
<script src="common.js"></script>
</head><body><div id="doc"></div>
<script>
load().then(function (bytes) {
  var box = document.getElementById('doc');
  return docx.renderAsync(bytes, box, null, {
    inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: false,
    renderHeaders: true, renderFooters: true, renderFootnotes: true, renderEndnotes: true, useBase64URL: true,
  }).then(function () {
    var pages = box.querySelectorAll('section.docx');
    pages.forEach(function (p) { p.classList.add('paper'); });
    // Pages are as wide as on paper: shrink them whole to the screen, keeping their layout.
    requestAnimationFrame(function () {
      var wrapper = box.querySelector('.docx-wrapper') || box;
      var widest = 0;
      pages.forEach(function (p) { widest = Math.max(widest, p.getBoundingClientRect().width); });
      // The screen, not the page: a page wider than the screen widens the page's own measure too.
      var screenWidth = Math.min(window.screen.width, window.visualViewport ? window.visualViewport.width : window.screen.width);
      var scale = widest > 0 ? Math.min(1, (screenWidth - 8) / (widest + 16)) : 1;
      console.log('docx fit: pages=' + pages.length + ' widest=' + widest + ' screen=' + screenWidth + ' scale=' + scale);
      if (scale < 1) {
        // Shrunk whole, keeping the layout; the box takes the shrunk height so scrolling ends at the last page.
        wrapper.style.transformOrigin = '0 0';
        wrapper.style.transform = 'scale(' + scale + ')';
        wrapper.style.width = (widest + 16) + 'px';
        box.style.height = (wrapper.scrollHeight * scale) + 'px';
        box.style.overflow = 'hidden';
      }
      done();
    });
  });
}).catch(done);
</script></body></html>
