.fade{animation:fadeUp .8s ease both}.f1{animation-delay:.08s}.f2{animation-delay:.16s}.f3{animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

@keyframes search{0%,100%{transform:translate(0,0)}25%{transform:translate(-70px,-30px)}50%{transform:translate(-40px,10px)}75%{transform:translate(-90px,-8px)}}
